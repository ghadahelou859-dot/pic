<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>دعوة زفاف</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  padding:0;

  background:#fffaf1;

  color:#9b7136;

  font-family:
  "Tahoma",
  Arial,
  sans-serif;
}


/* =========================
   كل صفحة
========================= */

.page{

  position:relative;

  width:100%;

  min-height:100vh;

  background:#fffaf1;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

}


/* =========================
   الصور
========================= */

.full-image{

  display:block;

  width:100%;

  height:auto;

  max-width:600px;

  margin:auto;

}


/* =========================
   صفحة البداية
========================= */

#intro{

  min-height:100vh;

  background:#fffaf1;

}


.video-box{

  position:relative;

  width:100%;

  max-width:600px;

  margin:auto;

}


#introVideo{

  display:block;

  width:100%;

  height:auto;

  max-height:100vh;

  object-fit:contain;

  background:#fffaf1;

}


/* زر فتح الدعوة */

#openButton{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  border:none;

  background:transparent;

  cursor:pointer;

  z-index:5;

}


/* عبارة اضغط */

#openText{

  position:absolute;

  left:50%;

  bottom:7%;

  transform:translateX(-50%);

  z-index:6;

  background:rgba(255,250,241,.92);

  border:

  1px solid
  rgba(168,122,53,.45);

  border-radius:50px;

  padding:10px 20px;

  color:#91672f;

  font-size:15px;

  white-space:nowrap;

  pointer-events:none;

  transition:.4s;

}


/* =========================
   سهم السحب
========================= */

.scroll-arrow{

  position:absolute;

  bottom:12px;

  left:50%;

  transform:translateX(-50%);

  font-size:28px;

  color:#b38b56;

  z-index:20;

  animation:

  moveArrow
  1.5s
  infinite;

}


@keyframes moveArrow{

  0%{
    transform:
    translate(-50%,0);
  }

  50%{
    transform:
    translate(-50%,8px);
  }

  100%{
    transform:
    translate(-50%,0);
  }

}


/* =========================
   زر الموسيقى
========================= */

#musicButton{

  position:fixed;

  left:18px;

  bottom:18px;

  width:48px;

  height:48px;

  border-radius:50%;

  border:

  1px solid
  rgba(168,122,53,.4);

  background:

  rgba(255,250,241,.95);

  color:#9b7136;

  z-index:999;

  cursor:pointer;

  font-size:19px;

  display:flex;

  align-items:center;

  justify-content:center;

}


/* =========================
   صفحة العداد
========================= */

#timer{

  min-height:100vh;

  padding:

  70px
  18px;

  background:#fffaf1;

  flex-direction:column;

}


/* زخرفة */

.timer-decoration{

  font-family:
  Georgia,
  serif;

  font-size:20px;

  margin-bottom:18px;

  opacity:.9;

}


/* العنوان */

.timer-title{

  margin:0;

  font-size:

  clamp(
    28px,
    7vw,
    44px
  );

  font-weight:400;

  color:#9b7136;

}


.timer-date{

  margin-top:12px;

  font-family:
  Georgia,
  serif;

  letter-spacing:2px;

  font-size:20px;

  color:#ad8351;

}


/* خط */

.divider{

  width:90px;

  height:1px;

  background:#c5a471;

  margin:

  25px
  auto
  45px;

}


/* الأربع دوائر */

.countdown{

  direction:rtl;

  width:100%;

  max-width:520px;

  display:grid;

  grid-template-columns:
  repeat(4,1fr);

  gap:12px;

}


/* كل عنصر */

.time-box{

  text-align:center;

}


/* الدائرة */

.circle{

  width:

  clamp(
    68px,
    19vw,
    105px
  );

  height:

  clamp(
    68px,
    19vw,
    105px
  );

  margin:auto;

  border:

  2px solid
  #b48b51;

  border-radius:50%;

  display:flex;

  align-items:center;

  justify-content:center;

  font-family:

  Georgia,
  "Times New Roman",
  serif;

  color:#a1763d;

  font-size:

  clamp(
    22px,
    6vw,
    36px
  );

  position:relative;

}


/* زخرفة بسيطة للدائرة */

.circle::before{

  content:"";

  position:absolute;

  inset:5px;

  border:

  1px solid
  rgba(180,139,81,.35);

  border-radius:50%;

}


/* اسم الوحدة */

.label{

  margin-top:12px;

  font-size:15px;

  color:#9c7443;

}


/* نص تحت العداد */

.timer-bottom{

  margin-top:55px;

  font-size:15px;

  color:#ad8351;

}


/* =========================
   صفحة الموقع
========================= */

#location{

  min-height:100vh;

  background:#fffaf1;

  flex-direction:column;

}


.location-link{

  width:100%;

  max-width:600px;

  display:block;

  text-decoration:none;

  color:inherit;

}


.location-image{

  display:block;

  width:100%;

  height:auto;

}


/* زر الموقع احتياطياً */

.map-button{

  display:block;

  width:

  min(
    300px,
    80%
  );

  margin:

  25px
  auto;

  text-align:center;

  padding:

  14px
  25px;

  border-radius:50px;

  background:#ad8351;

  color:#fffaf1;

  text-decoration:none;

  font-size:16px;

}


/* =========================
   الكمبيوتر
========================= */

@media(min-width:700px){

  body{

    background:#eee9df;

  }

  .page{

    width:500px;

    margin:auto;

  }

}


/* =========================
   صورة مفقودة
========================= */

.image-error{

  display:none;

  text-align:center;

  padding:30px;

  color:#8c6638;

}

</style>

</head>


<body>


<!-- =========================
     الموسيقى
========================= -->

<audio
  id="music"
  preload="auto"
  loop
>

  <source
    src="music.mp3"
    type="audio/mpeg"
  >

</audio>


<button
  id="musicButton"
  type="button"
>

♫

</button>



<!-- =========================
     1 — فتح المغلف
========================= -->

<section
  class="page"
  id="intro"
>

<div class="video-box">


<video
  id="introVideo"
  preload="metadata"
  playsinline
  webkit-playsinline
  poster="cover.png"
>

<source
  src="open.mp4"
  type="video/mp4"
>

</video>


<button
  id="openButton"
  type="button"
  aria-label="فتح الدعوة"
>
</button>


<div id="openText">

اضغطي لفتح الدعوة

</div>


</div>

</section>




<!-- =========================
     2 — Save The Date
========================= -->

<section
  class="page"
  id="save"
>

<img
  src="save.png"
  class="full-image"
  alt="Save the Date"
  onerror="this.style.display='none'; document.getElementById('saveError').style.display='block';"
>

<div
  class="image-error"
  id="saveError"
>

لم يتم العثور على ملف
<b>save.png</b>

</div>


<div class="scroll-arrow">
⌄
</div>

</section>




<!-- =========================
     3 — المعلومات
========================= -->

<section
  class="page"
  id="info"
>

<img
  src="info.png"
  class="full-image"
  alt="معلومات الزفاف"
  onerror="this.style.display='none'; document.getElementById('infoError').style.display='block';"
>


<div
  class="image-error"
  id="infoError"
>

لم يتم العثور على ملف
<b>info.png</b>

</div>


<div class="scroll-arrow">
⌄
</div>

</section>




<!-- =========================
     4 — العد التنازلي
========================= -->

<section
  class="page"
  id="timer"
>


<div class="timer-decoration">

❦

</div>


<h2 class="timer-title">

العد التنازلي ليومنا

</h2>


<div class="timer-date">

27 / 7 / 2027

</div>


<div class="divider"></div>


<div class="countdown">


<!-- يوم -->

<div class="time-box">

<div
  class="circle"
  id="days"
>

0

</div>

<div class="label">

يوم

</div>

</div>



<!-- ساعة -->

<div class="time-box">

<div
  class="circle"
  id="hours"
>

00

</div>

<div class="label">

ساعة

</div>

</div>



<!-- دقيقة -->

<div class="time-box">

<div
  class="circle"
  id="minutes"
>

00

</div>

<div class="label">

دقيقة

</div>

</div>



<!-- ثانية -->

<div class="time-box">

<div
  class="circle"
  id="seconds"
>

00

</div>

<div class="label">

ثانية

</div>

</div>


</div>


<div class="timer-bottom">

♡ ننتظركم لتكتمل فرحتنا ♡

</div>


<div class="scroll-arrow">
⌄
</div>


</section>




<!-- =========================
     5 — الموقع
========================= -->

<section
  class="page"
  id="location"
>


<a
  class="location-link"
  href="https://maps.app.goo.gl/3q5waWoJhZ8CDxVu8"
  target="_blank"
  rel="noopener"
>


<img
  src="map.png"
  class="location-image"
  alt="موقع حفل الزفاف"
  onerror="this.style.display='none'; document.getElementById('mapError').style.display='block';"
>


</a>


<div
  class="image-error"
  id="mapError"
>

لم يتم العثور على صورة
<b>map.png</b>

</div>


<a
  class="map-button"
  href="https://maps.app.goo.gl/3q5waWoJhZ8CDxVu8"
  target="_blank"
  rel="noopener"
>

فتح الموقع على الخريطة

</a>


</section>




<script>

/* ==============================
   العناصر
============================== */

const video =
document.getElementById("introVideo");


const openButton =
document.getElementById("openButton");


const openText =
document.getElementById("openText");


const music =
document.getElementById("music");


const musicButton =
document.getElementById("musicButton");


let opened = false;



/* ==============================
   الضغط على فتح المغلف
============================== */

openButton.addEventListener(
"click",

async function(){

if(opened){
return;
}

opened = true;


/* إخفاء الكتابة */

openText.style.opacity =
"0";


/* تشغيل الموسيقى */

try{

music.volume =
0.65;

await music.play();

musicButton.innerHTML =
"❚❚";

}catch(error){

console.log(
"الموسيقى تحتاج ضغطة من المستخدم"
);

}


/* تشغيل الفيديو */

try{

video.currentTime =
0;

await video.play();

}catch(error){

console.log(
"مشكلة في تشغيل الفيديو"
);

goToSave();

}

}

);



/* ==============================
   بعد انتهاء الفيديو
============================== */

video.addEventListener(
"ended",

function(){

goToSave();

}

);



function goToSave(){

document
.getElementById("save")
.scrollIntoView({

behavior:"smooth",

block:"start"

});

}



/* ==============================
   زر الموسيقى
============================== */

musicButton.addEventListener(
"click",

async function(){

if(
music.paused
){

try{

await music.play();

musicButton.innerHTML =
"❚❚";

}catch(error){}

}

else{

music.pause();

musicButton.innerHTML =
"♫";

}

}

);



/* ==============================
   تاريخ الزفاف
   27 يوليو 2027
   الساعة 7 مساء
============================== */

const weddingDate =
new Date(
2027,
6,
27,
19,
0,
0
);



/* ==============================
   عناصر العداد
============================== */

const daysElement =
document.getElementById("days");


const hoursElement =
document.getElementById("hours");


const minutesElement =
document.getElementById("minutes");


const secondsElement =
document.getElementById("seconds");



/* ==============================
   تحديث العداد
============================== */

function updateCountdown(){


const now =
new Date();


let difference =
weddingDate - now;



if(
difference <= 0
){

daysElement.textContent =
"0";

hoursElement.textContent =
"00";

minutesElement.textContent =
"00";

secondsElement.textContent =
"00";

return;

}



const totalSeconds =
Math.floor(
difference / 1000
);



const days =
Math.floor(
totalSeconds /
86400
);



const hours =
Math.floor(
(totalSeconds % 86400) /
3600
);



const minutes =
Math.floor(
(totalSeconds % 3600) /
60
);



const seconds =
totalSeconds %
60;



daysElement.textContent =
days;


hoursElement.textContent =
String(hours)
.padStart(
2,
"0"
);


minutesElement.textContent =
String(minutes)
.padStart(
2,
"0"
);


secondsElement.textContent =
String(seconds)
.padStart(
2,
"0"
);

}



/* تشغيل مباشر */

updateCountdown();


/* تحديث كل ثانية */

setInterval(
updateCountdown,
1000
);



/* ==============================
   فحص الفيديو
============================== */

video.addEventListener(
"error",

function(){

console.log(
"تأكدي أن اسم الفيديو open.mp4"
);

}

);

</script>


</body>

</html>
